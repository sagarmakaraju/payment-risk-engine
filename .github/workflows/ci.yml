name: FS-2601 Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Build, Test & Chaos Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Code Hygiene (go vet)
        run: |
          go vet ./internal/...
          go vet ./cmd/...
          go vet ./tests/...

      - name: Execute Full Test Suite (Unit & Integration)
        run: |
          go test -v -count=1 ./tests/...

      - name: Execute Memory & Latency Benchmarks
        run: |
          go test -bench="." -benchmem ./tests/...

      - name: Build Standalone Server Binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/server ./cmd/server

      - name: Start Background Server & Execute 11-Phase Chaos Simulation
        run: |
          chmod +x bin/server scripts/partition_simulation.sh
          ./bin/server &
          SERVER_PID=$!
          sleep 2

          # Run automated 11-phase chaos simulation
          bash ./scripts/partition_simulation.sh

          # Run 500-concurrency Python benchmark
          python ./scripts/benchmark_concurrency.py

          kill $SERVER_PID
